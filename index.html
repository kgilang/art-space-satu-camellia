<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/favicon.png">
  <title>Satu Camellia &mdash; Art Space</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header>
    <div class="header-badge">81st Independence Day Archive</div>
    <h1 class="brand-title">SATU CAMELLIA</h1>
    <h2 class="brand-subtitle">Art Space</h2>
    <p class="brand-tagline">A curated collection of neighborhood celebration memories</p>
    <div class="divider"></div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search memories...">
      </div>
      <div id="photoCount" class="photo-count">0 Items</div>
    </div>

    <div id="statusContainer" class="status-container">
      <div class="spinner"></div>
      <p>Curating exhibition space...</p>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>

    <div class="load-more-wrapper">
      <button id="loadMoreBtn" class="load-more-btn" style="display: none;">Load More Memories</button>
    </div>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="lightboxClose" class="lightbox-btn close-btn" aria-label="Close">&times;</button>
    <button id="lightboxPrev" class="lightbox-btn prev-btn" aria-label="Previous">&#8249;</button>
    <button id="lightboxNext" class="lightbox-btn next-btn" aria-label="Next">&#8250;</button>
    
    <div class="lightbox-wrapper">
      <div id="lightboxMediaContainer" class="lightbox-media-container"></div>
      <div class="lightbox-meta">
        <div id="lightboxCaption" class="lightbox-caption"></div>
        <div id="lightboxCounter" class="lightbox-counter"></div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 <a href="https://leveldigital.id" target="_blank" rel="noopener">LED.ID</a>. All Rights Reserved.</p>
    <p class="footer-sub">Crafted for Community Memories</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
